# tzstore — 地域の規則（tzdata）の鮮度の見張り（ユーザー裁定 2026-11-05 ⑤-11 — 信頼ストアと同じ形）。週に 1 度、IANA の tz の最新の版を
# 焼き込みの銘（testdata/tz/SOURCE）の版と比べ、新しければ scripts/tzstore.sh --regen で作り直した PR（zic は ubuntu の libc-bin のもの） を起こす（同じタグの PR が開いていれば何もしない）。
# dev（非公開）と公開のどちらのリポジトリでも同じファイルで動く（公開同期が workflow も運ぶ — secrets・リポジトリ名・固有のパスに依らない。リポジトリは github.repository）:
# 非公開 = 正史の regen の PR（作れない設定なら issue に倒す）・公開 = 鮮度の信号の issue（PR は起こさない — 正史は dev の regen が公開同期で運ぶ）。GITHUB_TOKEN で作った PR では CI が自動では走らない — 取り込む前に手元で gates を回す
name: tzstore

on:
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

concurrency:
  group: tzstore
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  tzstore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compare the pinned tz version with the latest
        id: tags
        run: |
          pinned=$(scripts/tzstore.sh --pinned)
          latest=$(scripts/tzstore.sh --latest)
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "pinned $pinned / latest $latest" >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate and open a PR (or an issue)
        if: steps.tags.outputs.latest != '' && steps.tags.outputs.latest != steps.tags.outputs.pinned
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRIVATE: ${{ github.event.repository.private }}
          LATEST: ${{ steps.tags.outputs.latest }}
          PINNED: ${{ steps.tags.outputs.pinned }}
        run: |
          if [ "$PRIVATE" != "true" ]; then
            title="地域の規則の更新: tz $LATEST"
            if [ -z "$(gh issue list --repo "$GH_REPO" --search "$title in:title" --state open --json number --jq '.[].number')" ]; then
              gh issue create --repo "$GH_REPO" --title "$title" --body "銘の版 $PINNED に対して最新は $LATEST（鮮度の信号 — 正史の regen は dev のリポジトリで行い、公開同期で運ばれる）。"
            fi
            echo "public repository: opened a freshness issue for $LATEST" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          branch="tzstore/$LATEST"
          if [ -n "$(gh pr list --repo "$GH_REPO" --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "an open PR for $LATEST exists" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          scripts/tzstore.sh --regen "$LATEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/std/time/zones.sober testdata/tz
          git commit -m "std/time: 地域の規則を tz $LATEST に（scripts/tzstore.sh --regen）"
          body="scripts/tzstore.sh --regen $LATEST（$PINNED から）。取り込む前に手元で scripts/gates.sh --full（tzsync・unittest の std/time・datadce）を回し、ゾーンの増減と規則の変更を確かめる。"
          if git push origin "$branch" && gh pr create --repo "$GH_REPO" --head "$branch" --title "地域の規則を tz $LATEST に" --body "$body"; then
            echo "opened a PR for $LATEST" >> "$GITHUB_STEP_SUMMARY"
          else
            title="地域の規則の更新: tz $LATEST"
            if [ -z "$(gh issue list --repo "$GH_REPO" --search "$title in:title" --state open --json number --jq '.[].number')" ]; then
              gh issue create --repo "$GH_REPO" --title "$title" --body "PR を作れなかった。手元で $body"
            fi
            echo "opened an issue for $LATEST" >> "$GITHUB_STEP_SUMMARY"
          fi
