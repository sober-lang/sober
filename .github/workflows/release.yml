# Release: build the compiler from source (full bootstrap, then the compiler built by itself) and attach the binary to a GitHub Release.
# Triggered by pushing a tag v* (e.g. v0.5.0).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "existing tag (e.g. v0.6.0) to (re)publish the ghcr image for"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build stage1 (frozen Zig compiler)
        run: cd src/stage1 && zig build

      - name: Stamp the version
        # the places the version is baked in (the lines that end in `// sober-version`): `version: "dev",` in src/compiler/app/main.sober
        # (sober --version) and `const RtVersion = "dev"` in src/compiler/lower/task.sober (the runtime's fatal line in compiled programs)
        run: |
          sed -i 's|version: "dev", // sober-version$|version: "${{ github.ref_name }}", // sober-version|' src/compiler/app/main.sober
          grep -q 'version: "${{ github.ref_name }}", // sober-version$' src/compiler/app/main.sober
          sed -i 's|^const RtVersion = "dev" // sober-version$|const RtVersion = "${{ github.ref_name }}" // sober-version|' src/compiler/lower/task.sober
          grep -q '^const RtVersion = "${{ github.ref_name }}" // sober-version$' src/compiler/lower/task.sober

      - name: Build stage2 (bootstrap chain)
        run: scripts/stage2.sh

      # The release-only gates: checks taken out of the per-merge gate run (scripts/gates.sh --release has them
      # too). Run here, before stage3 is built, so a release cannot skip them: stage3 bakes the cache values of std
      # and rt into the released binary, and only values from a run that passed these gates may be baked (the CI
      # has no record of the server runs that scripts/releaseok.sh reads, so passing them in this job is the mark).
      # They read the stage2 built above and the corpus in examples/ and testdata/ (no Lean, no external downloads).
      - name: Release-only gates (split-check cache and its keys)
        env:
          JOBS: 4
          SOBER_WORKERS: 1
          SOBER_HASH_SEED: 0
          LC_ALL: C.UTF-8
        run: |
          scripts/splitcache.sh
          scripts/cachekey.sh

      # The released binary is stage3: stage2 builds the compiler itself (with the std L0 and the std / rt cache
      # values baked in — scripts/stagelib.sh stage_bake). --check rebuilds it with itself and requires the same
      # ELF (fixed point).
      - name: Build stage3 (the released binary) and check the fixed point
        run: scripts/stage3.sh --check -o out/stage3/sober

      - name: Smoke test
        run: |
          out/stage3/sober build examples/hello.sober -o out/hello   # the default (= --emit=elf --passes), what a user of the released binary types
          ./out/hello > out/hello.got
          diff examples/hello.out out/hello.got
          [ "$(out/stage3/sober --version)" = "sober ${{ github.ref_name }}" ]

      - name: Package
        run: |
          mkdir -p dist/sober-${{ github.ref_name }}-x86_64-linux
          cp out/stage3/sober dist/sober-${{ github.ref_name }}-x86_64-linux/sober
          cp README.md LICENSE-MIT LICENSE-APACHE dist/sober-${{ github.ref_name }}-x86_64-linux/
          tar -C dist -czf dist/sober-${{ github.ref_name }}-x86_64-linux.tar.gz sober-${{ github.ref_name }}-x86_64-linux
          (cd dist && sha256sum sober-${{ github.ref_name }}-x86_64-linux.tar.gz > sober-${{ github.ref_name }}-x86_64-linux.tar.gz.sha256)

      # The release notes are the tag's section of CHANGELOG.md (the heading "## <tag> (<date>)" up to the next
      # "## v" heading). A tag without a CHANGELOG entry fails here, before anything is published.
      - name: Release notes from CHANGELOG
        run: |
          awk -v tag="${{ github.ref_name }}" '
            $0 ~ "^## " tag "( |$)" { f = 1; next }
            /^## v/ { if (f) exit }
            f' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || { echo "CHANGELOG.md has no section for ${{ github.ref_name }}" >&2; exit 1; }

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/notes.md
          files: |
            dist/sober-${{ github.ref_name }}-x86_64-linux.tar.gz
            dist/sober-${{ github.ref_name }}-x86_64-linux.tar.gz.sha256

  # The toolchain image: FROM ghcr.io/sober-lang/sober:<ver> gives a build stage with `sober` on PATH,
  # no download from github.com at docker-build time (registry pulls only - the mainstream shape of
  # language toolchains in Dockerfiles). Built from the released tarball so the image is byte-identical
  # to the release; `workflow_dispatch` republishes the image for an existing tag.
  image:
    runs-on: ubuntu-24.04
    needs: [release]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success')
    steps:
      - name: Resolve version
        run: |
          V="${{ github.event.inputs.version || github.ref_name }}"
          echo "V=$V" >> "$GITHUB_ENV"
          echo "BARE=${V#v}" >> "$GITHUB_ENV"

      - name: Fetch the released tarball
        run: |
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/$V/sober-$V-x86_64-linux.tar.gz" -o sober.tar.gz
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/$V/sober-$V-x86_64-linux.tar.gz.sha256" -o sober.tar.gz.sha256
          [ "$(sha256sum sober.tar.gz | cut -d' ' -f1)" = "$(cut -d' ' -f1 sober.tar.gz.sha256)" ]
          tar -xzf sober.tar.gz
          mkdir -p img && cp "sober-$V-x86_64-linux/sober" img/sober

      - name: Build the image
        run: |
          cat > img/Dockerfile <<EOF
          FROM alpine:3.20
          COPY sober /usr/local/bin/sober
          CMD ["sober"]
          EOF
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.description="The Sober compiler (single static ELF, stdlib built in)" \
            --label org.opencontainers.image.licenses="MIT OR Apache-2.0" \
            -t "ghcr.io/${{ github.repository }}:$BARE" -t "ghcr.io/${{ github.repository }}:latest" img

      - name: Push to ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/${{ github.repository }}:$BARE"
          docker push "ghcr.io/${{ github.repository }}:latest"
