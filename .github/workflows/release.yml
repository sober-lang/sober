# Release: build the compiler from source (full bootstrap) and attach the binary to a GitHub Release.
# Triggered by pushing a tag v* (e.g. v0.5.0).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "existing tag (e.g. v0.6.0) to (re)publish the ghcr image for"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build stage1 (frozen Zig compiler)
        run: cd src/stage1 && zig build

      - name: Stamp the version
        # the only place the version is baked in: the `return "dev" // sober-version` line of src/compiler/app/main.sober
        run: |
          sed -i 's|return "dev" // sober-version$|return "${{ github.ref_name }}" // sober-version|' src/compiler/app/main.sober
          grep -q 'return "${{ github.ref_name }}" // sober-version$' src/compiler/app/main.sober

      - name: Build stage2 (bootstrap chain)
        run: scripts/stage2.sh

      - name: Smoke test
        run: |
          out/stage2/sober2 build examples/hello.sober -o out/hello   # the default (= --emit=elf --passes) — what a user of the released binary types
          ./out/hello > out/hello.got
          diff examples/hello.out out/hello.got
          [ "$(out/stage2/sober2 --version)" = "sober ${{ github.ref_name }}" ]

      - name: Package
        run: |
          mkdir -p dist/sober-${{ github.ref_name }}-x86_64-linux
          cp out/stage2/sober2 dist/sober-${{ github.ref_name }}-x86_64-linux/sober
          cp README.md LICENSE-MIT LICENSE-APACHE dist/sober-${{ github.ref_name }}-x86_64-linux/
          tar -C dist -czf dist/sober-${{ github.ref_name }}-x86_64-linux.tar.gz sober-${{ github.ref_name }}-x86_64-linux
          (cd dist && sha256sum sober-${{ github.ref_name }}-x86_64-linux.tar.gz > sober-${{ github.ref_name }}-x86_64-linux.tar.gz.sha256)

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sober-${{ github.ref_name }}-x86_64-linux.tar.gz
            dist/sober-${{ github.ref_name }}-x86_64-linux.tar.gz.sha256

  # The toolchain image: FROM ghcr.io/sober-lang/sober:<ver> gives a build stage with `sober` on PATH,
  # no download from github.com at docker-build time (registry pulls only - the mainstream shape of
  # language toolchains in Dockerfiles). Built from the released tarball so the image is byte-identical
  # to the release; `workflow_dispatch` republishes the image for an existing tag.
  image:
    runs-on: ubuntu-24.04
    needs: [release]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success')
    steps:
      - name: Resolve version
        run: |
          V="${{ github.event.inputs.version || github.ref_name }}"
          echo "V=$V" >> "$GITHUB_ENV"
          echo "BARE=${V#v}" >> "$GITHUB_ENV"

      - name: Fetch the released tarball
        run: |
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/$V/sober-$V-x86_64-linux.tar.gz" -o sober.tar.gz
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/$V/sober-$V-x86_64-linux.tar.gz.sha256" -o sober.tar.gz.sha256
          [ "$(sha256sum sober.tar.gz | cut -d' ' -f1)" = "$(cut -d' ' -f1 sober.tar.gz.sha256)" ]
          tar -xzf sober.tar.gz
          mkdir -p img && cp "sober-$V-x86_64-linux/sober" img/sober

      - name: Build the image
        run: |
          cat > img/Dockerfile <<EOF
          FROM alpine:3.20
          COPY sober /usr/local/bin/sober
          CMD ["sober"]
          EOF
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.description="The Sober compiler (single static ELF, stdlib built in)" \
            --label org.opencontainers.image.licenses="MIT OR Apache-2.0" \
            -t "ghcr.io/${{ github.repository }}:$BARE" -t "ghcr.io/${{ github.repository }}:latest" img

      - name: Push to ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/${{ github.repository }}:$BARE"
          docker push "ghcr.io/${{ github.repository }}:latest"
