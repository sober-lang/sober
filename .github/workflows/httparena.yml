# HttpArena (HTTP/1.1 profiles) — Sober vs. a Go net/http control, measured in the same job.
# Manual trigger only. Builds the compiler from source (same bootstrap as release.yml), builds HttpArena's load generator
# (gcannon on liburing 2.9 — the versions HttpArena's docker/gcannon.Dockerfile uses), then runs bench/httparena/local.sh:
# both servers alternate round by round on the same pinned CPUs, and the job summary gets the per-profile medians and the
# Sober/Go ratio. Read the ratio, not the absolute numbers (a shared 4-vCPU runner — PINS: "HttpArena のベンチ環境 = GitHub Actions").
name: httparena

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "rounds per profile (alternating Sober / Go — the summary is the median)"
        default: "5"
      duration:
        description: "seconds per run"
        default: "5"
      conns:
        description: "connections (HttpArena's baseline uses 4096)"
        default: "4096"
      profiles:
        description: "space-separated: baseline pipelined limited-conn json json-comp json-comp-16k latency-1m latency-10k latency-500k-8cpu json-tls async (async last — it leaves ~32K sockets in TIME_WAIT; json = the /json/{count} endpoint uncompressed, local comparison only; json-comp = gzip at 4096 conns, json-comp-16k = 16384; json-tls = wrk over TLS 1.3 at 4096 conns; 8gbit = zrk POST /echo 10 KB over TLS at a fixed 50K req/s, 512 conns; latency-500k-8cpu = the latency-1m GET at a fixed 500K req/s with the server on 8 logical CPUs — 4 cores + SMT siblings, as upstream)"
        default: "baseline pipelined limited-conn json json-comp json-comp-16k json-tls 8gbit latency-1m latency-10k latency-500k-8cpu async"
      sober_net:
        description: "SOBER_NET for the Sober server: 0 = io_uring net ring when the kernel accepts it, 1 = epoll path"
        default: "0"
      sober_env:
        description: "extra env for the Sober server only, space-separated (e.g. \"SOBER_WORKERS=31 SOBER_PIN=1\" — overrides local.sh's SOBER_WORKERS; empty = none)"
        default: ""
      alt_ref:
        description: "branch, tag or commit (full or short SHA) to build as a third server (sober-alt) alternating with Sober / Go in the same job — an A/B on the same box; empty = none"
        default: ""
      alt_env:
        description: "extra env for sober-alt only, space-separated (after sober_env). Without alt_ref, sober-alt is the same binary as Sober — an env A/B on the same box (e.g. \"SOBER_NET_FIXED=0\")"
        default: ""
      runner:
        description: "runs-on label (linux-x64-16vcpu = the org's larger runner, 8 server / 8 load cores; ubuntu-24.04 = free 2-vCPU)"
        default: "linux-x64-16vcpu"
      perf:
        description: "1 = also sample the Sober server with perf (cpu-clock, kernel symbols) under the perf_profiles loads"
        default: "1"
      perf_profiles:
        description: "profiles for the perf step, space-separated: baseline pipelined limited-conn latency-10k latency-1m async (limited-conn = -r 10 churn; latency-* = zrk at the fixed rate — the report's cpu/req line is the point, read the breakdown with it; async = GET /delay/10 at $ASYNC_CONNS = 32000 conns — the sys / user split of the timer-holding shape; put it last, it leaves ~32K sockets in TIME_WAIT)"
        default: "baseline pipelined"
      perf_nets:
        description: "SOBER_NET values for the perf step, space-separated (e.g. \"1 0\" = epoll then ring — the same binary, one profile each); empty = sober_net"
        default: ""
      kstat_rate:
        description: "forms for the rt counters at a fixed rate (dlsrv --rt-mutant=4 under zrk — enter/req, sleeps/req, cqe/enter, cpu/req per worker), space-separated: latency-10k latency-1m; empty = skip"
        default: ""
      cg_mem:
        description: "1 = run each server in its own cgroup v2 and add memory.peak + end-of-run anon/file/kernel/sock to the RSS table (the container-style count the leaderboard's mem column uses)"
        default: "1"
      rt_hist:
        description: "forms for the rt histogram step (dlsrv built with --rt-mutant=4 — ready-ring depth / ring wait / off-CPU per pick), space-separated: churn ka async; empty = skip"
        default: ""

permissions:
  contents: read

jobs:
  httparena:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build stage1 and stage2 (bootstrap chain)
        run: |
          (cd src/stage1 && zig build)
          scripts/stage2.sh

      - name: Build the alt Sober server (alt_ref)
        if: ${{ inputs.alt_ref != '' }}
        env:
          ALT_REF: ${{ inputs.alt_ref }}
        run: |
          # ブランチ・タグ・完全な SHA は直に取れる。短縮 SHA は GitHub が取らせないので、歴史を全部取ってから rev-parse で解く
          if git fetch --no-tags --depth=1 origin "$ALT_REF"; then
            alt=$(git rev-parse FETCH_HEAD)
          else
            git fetch --no-tags --unshallow origin '+refs/heads/*:refs/remotes/origin/*'
            alt=$(git rev-parse --verify "$ALT_REF^{commit}")
          fi
          git worktree add --detach "$RUNNER_TEMP/alt" "$alt"
          (cd "$RUNNER_TEMP/alt/src/stage1" && zig build)
          # 版ごとの main.sober で建てる（版どうしの比較 — entry の変更も込みで比べる）
          (cd "$RUNNER_TEMP/alt/bench/httparena" && ../../bin/sober build main.sober -o "$RUNNER_TEMP/alt-srv")
          echo "SOBER_ALT_BIN=$RUNNER_TEMP/alt-srv" >> "$GITHUB_ENV"
          echo "alt: $(git -C "$RUNNER_TEMP/alt" rev-parse --short=9 HEAD) $(git -C "$RUNNER_TEMP/alt" log -1 --format=%s)"

      - name: Build gcannon (liburing 2.9)
        run: |
          mkdir -p "$RUNNER_TEMP/gc" && cd "$RUNNER_TEMP/gc"
          git clone --quiet --branch liburing-2.9 --depth 1 https://github.com/axboe/liburing.git
          (cd liburing && ./configure --prefix="$RUNNER_TEMP/gc/usr" > /dev/null && make -s -j"$(nproc)" -C src && make -s install -C src)
          git clone --quiet --depth 1 https://github.com/MDA2AV/gcannon.git
          cd gcannon
          make -s -j"$(nproc)" CFLAGS="-O2 -march=native -Iinclude -DUSE_PICO -Iexternal/picohttpparser -I$RUNNER_TEMP/gc/usr/include" \
            LDFLAGS="-L$RUNNER_TEMP/gc/usr/lib -Wl,-rpath,$RUNNER_TEMP/gc/usr/lib -luring -lpthread"
          echo "GCANNON=$RUNNER_TEMP/gc/gcannon/gcannon" >> "$GITHUB_ENV"

      - name: Install wrk (json-tls — HttpArena's load generator for the TLS profiles)
        run: sudo apt-get -qq update && sudo apt-get -qq install -y wrk

      - name: Kernel and CPU
        run: |
          uname -r
          lscpu -e=CPU,CORE,ONLINE
          # THP の設定（report-1053 — 固定床 ≈250 MB の 2/3 が THP の水増しの読み。local.sh の rss 行の AnonHugePages と対で読む）
          echo "thp: enabled=$(cat /sys/kernel/mm/transparent_hugepage/enabled) defrag=$(cat /sys/kernel/mm/transparent_hugepage/defrag)"
          sudo sysctl -w net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535 net.ipv4.ip_local_port_range="1024 65535"
          # サーバの listen port（local.sh の 18000 番台）を ephemeral の配布から外す — 広げた範囲と重なると
          # TIME_WAIT の客側 port に bind して黙って失敗する（run 38696245258 — latency-1m の後の起動失敗）
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=18000-18999
          # runner VM の Docker の netfilter 規則が loopback のベンチに ~7% 乗る（nf_conntrack 4.5% +
          # nf_nat + nf_tables + nf_hook_slow — run 38651314997 の perf）。規則を流してモジュールを外す
          # （外せなければ無視 — Sober / Go の両方に等しく乗るので比は中立・絶対値の掃除）
          sudo systemctl stop docker docker.socket 2> /dev/null || true
          sudo nft flush ruleset 2> /dev/null || true
          sudo iptables -F 2> /dev/null || true
          sudo iptables -t nat -F 2> /dev/null || true
          # モジュールが外れなくても loopback の追跡だけ外す（raw の NOTRACK — run 38652999799 で
          # modprobe -r が効かず nf_conntrack 3.9% が残った）
          sudo iptables -t raw -I PREROUTING -i lo -j NOTRACK 2> /dev/null || true
          sudo iptables -t raw -I OUTPUT -o lo -j NOTRACK 2> /dev/null || true
          sudo modprobe -r nf_nat nf_conntrack 2> /dev/null || echo "conntrack module still loaded (NOTRACK applied)"

      - name: Validate (std/http gate — the same checks as scripts/httpcheck.sh)
        run: scripts/httpcheck.sh

      - name: Run (alternating Sober / Go)
        env:
          SOBER_NET: ${{ inputs.sober_net }}
          SOBER_SRV_ENV: ${{ inputs.sober_env }}
          SOBER_ALT_ENV: ${{ inputs.alt_env }}
          # latency-1m の 1M req/s は本家の 32 コア箱の値 — 8 サーバコアでは Go が飽和（~460K・rate_ratio 0.46）するので
          # コア比で 250K に（1M × 8/32）。64vcpu（32 サーバコア = 本家と同格）では本家と同じ 1M で「保てるか」を見る
          ZRK_RATE_1M: ${{ inputs.runner == 'linux-x64-64vcpu' && '1000000' || '250000' }}
        run: |
          # 64vcpu: gcannon の 32 スレッドの io_uring_queue_init が memlock 上限で ENOMEM（run 39027897300 の gc-*.txt）。
          # prlimit はこのステップのシェルに掛け、子（local.sh → gcannon / サーバ）が継承する
          sudo prlimit --pid $$ --memlock=unlimited --nofile=1048576:1048576 || true
          ulimit -n 1048576 || ulimit -n 65536
          # 計測環境（dudect / bench-official の前例 — 箱の CPU の型番・大きさ・runner は run ごとに変わりうる。16vcpu と 64vcpu の
          # 取り違え〔report-1147〕を gh run view で引き直さずに見えるよう、要約の見出し・httparena-env.txt・TSV の env の列に積む）
          cpu=$(lscpu | sed -n 's/^Model name: *//p')
          {
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "commit=$(git rev-parse --short=8 HEAD)"
            echo "runner=${{ inputs.runner }}"
            echo "runner_name=$RUNNER_NAME"
            echo "cpu=$cpu"
            echo "nproc=$(nproc)"
            echo "kernel=$(uname -r)"
            echo "sober_net=$SOBER_NET"
            echo "sober_env=$SOBER_SRV_ENV"
            echo "alt_ref=${{ inputs.alt_ref }}"
            echo "alt_env=$SOBER_ALT_ENV"
            echo "rounds=${{ inputs.rounds }}"
            echo "duration=${{ inputs.duration }}"
            echo "conns=${{ inputs.conns }}"
            echo "zrk_rate_1m=$ZRK_RATE_1M"
            echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$RUNNER_TEMP/httparena-env.txt"
          export HTTPARENA_ENV="gha-${{ inputs.runner }}/$(echo "$cpu" | sed 's/^AMD //; s/ [0-9]*-Core Processor$//; s/ w\/ .*//; s/ /-/g')"
          {
            echo "## HttpArena HTTP/1.1 — Sober / Go"
            echo
            echo "- env: $HTTPARENA_ENV · cpu: $cpu · nproc: $(nproc) · runner: $RUNNER_NAME · kernel: $(uname -r) · SOBER_NET=${SOBER_NET} · sober_env: ${SOBER_SRV_ENV:-none} · alt_ref: ${{ inputs.alt_ref || 'none' }} · alt_env: ${SOBER_ALT_ENV:-none} · latency-1m rate: $ZRK_RATE_1M"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # cg_mem: サーバを走りごとの子の cgroup で起動する（local.sh の HTTPARENA_CG）。このシェルを委譲した dir の葉（sh）へ移し、
          # dir を runner の持ち物に — 移す書き込みは「移す元と先の共通の祖先の cgroup.procs」に要る権限で、それが委譲した dir になる
          if [ "${{ inputs.cg_mem }}" = 1 ] && [ -f /sys/fs/cgroup/cgroup.subtree_control ]; then
            cg=/sys/fs/cgroup/httparena
            if sudo mkdir -p "$cg/sh" && echo +memory | sudo tee /sys/fs/cgroup/cgroup.subtree_control > /dev/null \
              && echo +memory | sudo tee "$cg/cgroup.subtree_control" > /dev/null \
              && sudo chown -R "$(id -u):$(id -g)" "$cg" && echo $$ | sudo tee "$cg/sh/cgroup.procs" > /dev/null; then
              export HTTPARENA_CG=$cg
              echo "cgroup: $cg (controllers: $(cat "$cg/cgroup.subtree_control"))"
            else
              echo "cgroup: setup failed — the cg_* columns stay empty"
            fi
          fi
          ulimit -n
          HTTPARENA_WORK="$RUNNER_TEMP/work" \
          bench/httparena/local.sh -n "${{ inputs.rounds }}" -d "${{ inputs.duration }}" -c "${{ inputs.conns }}" \
            --profiles "${{ inputs.profiles }}" -o "$RUNNER_TEMP/httparena.tsv" --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Kernel profile (perf cpu-clock — where the sys side of CPU/req goes; report-673)
        if: ${{ inputs.perf == '1' }}
        env:
          NETS: ${{ inputs.perf_nets != '' && inputs.perf_nets || inputs.sober_net }}
          PROFS: ${{ inputs.perf_profiles }}
          # latency-1m のレートは Run のステップと同じ（16vcpu はコア比で 250K）
          ZRK_RATE_1M: ${{ inputs.runner == 'linux-x64-64vcpu' && '1000000' || '250000' }}
        run: |
          # zrk（latency-*）: Run のステップが取った pin があれば使う（無ければ perf.sh が同じ pin を取る）
          [ -x "$RUNNER_TEMP/work/zrk" ] && export ZRK="$RUNNER_TEMP/work/zrk"
          sudo apt-get -qq update
          sudo apt-get -qq install -y linux-tools-common "linux-tools-$(uname -r)" 2> /dev/null || sudo apt-get -qq install -y linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          # SOBER_NET ごとに同じ実行ファイルを測る（perf_nets — 例 "1 0" = epoll と ring を 1 run で並べる・report-681）。
          # pipelined の同じ内訳 — baseline との差分が「パケット数に比例する成分」を分離する
          # async（perf_profiles に async）は 32000 接続 — nofile を Run のステップと同じに上げる（prlimit はこのシェルに掛け子が継承）
          sudo prlimit --pid $$ --memlock=unlimited --nofile=1048576:1048576 || true
          ulimit -n 1048576 || ulimit -n 65536
          for net in $NETS; do
            for prof in $PROFS; do
              # 出力の名前は baseline だけ接尾辞なし（前の run の perf-report-net<N>.txt と同じ名前を保つ）
              sfx=$([ "$prof" = baseline ] && echo "" || echo "-$prof")
              SOBER_NET=$net bench/httparena/perf.sh -d 10 -c "${{ inputs.conns }}" --profile "$prof" -o "$RUNNER_TEMP/perf-report-net$net$sfx.txt"
              {
                echo
                echo "## perf (cpu-clock, $prof, Sober server, SOBER_NET=$net)"
                echo '```'
                head -$([ "$prof" = pipelined ] && echo 40 || echo 60) "$RUNNER_TEMP/perf-report-net$net$sfx.txt"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            done
          done

      - name: rt counters at a fixed rate (--rt-mutant=4 dlsrv under zrk — the per-request round trip of the latency profiles)
        if: ${{ inputs.kstat_rate != '' }}
        env:
          FORMS: ${{ inputs.kstat_rate }}
          ZRK_RATE_1M: ${{ inputs.runner == 'linux-x64-64vcpu' && '1000000' || '250000' }}
        run: |
          [ -x "$RUNNER_TEMP/work/zrk" ] && export ZRK="$RUNNER_TEMP/work/zrk"
          if [ -z "${ZRK:-}" ]; then
            # Run のステップに latency-* が無かった — local.sh と同じ pin を取る
            curl -fsSL -o "$RUNNER_TEMP/zrk.tar.gz" https://github.com/zoxy-io/zrk/releases/download/v2.3.0/zrk-2.3.0-x86_64-linux.tar.gz
            echo "ab6f1c1ce34ce73f52afd106419d15e5c494bd1cedd475afa56babb85b09a816  $RUNNER_TEMP/zrk.tar.gz" | sha256sum -c -
            tar xzf "$RUNNER_TEMP/zrk.tar.gz" -C "$RUNNER_TEMP" zrk && export ZRK="$RUNNER_TEMP/zrk"
          fi
          [ -x "$RUNNER_TEMP/ksrv4" ] || out/stage2/sober2 build bench/httparena/tools/dlsrv.sober --emit=elf --passes --rt-mutant=4 -o "$RUNNER_TEMP/ksrv4"
          PER=1 bench/httparena/tools/kstatrate.sh "$RUNNER_TEMP/ksrv4" $FORMS | tee "$RUNNER_TEMP/kstatrate.txt"
          {
            echo
            echo "## rt counters at a fixed rate (--rt-mutant=4 — the counters add their own cost: read cpu/req as a ratio, not the score)"
            echo '```'
            cat "$RUNNER_TEMP/kstatrate.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: rt histogram (--rt-mutant=4 dlsrv — ready-ring depth / ring wait / off-CPU per pick)
        if: ${{ inputs.rt_hist != '' }}
        env:
          FORMS: ${{ inputs.rt_hist }}
        run: |
          # async は 32000 接続 — nofile / memlock を Run のステップと同じに（prlimit はこのシェルに掛け子が継承）
          sudo prlimit --pid $$ --memlock=unlimited --nofile=1048576:1048576 || true
          ulimit -n 1048576 || ulimit -n 65536
          [ -x "$RUNNER_TEMP/ksrv4" ] || out/stage2/sober2 build bench/httparena/tools/dlsrv.sober --emit=elf --passes --rt-mutant=4 -o "$RUNNER_TEMP/ksrv4"
          bench/httparena/tools/rthist.sh "$RUNNER_TEMP/ksrv4" $FORMS | tee "$RUNNER_TEMP/rthist.txt"
          {
            echo
            echo "## rt histogram (--rt-mutant=4 — depth / ring wait / off-CPU at the pick point)"
            echo '```'
            cat "$RUNNER_TEMP/rthist.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: httparena-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/httparena.tsv
            ${{ runner.temp }}/httparena.tsv.rss
            ${{ runner.temp }}/httparena.tsv.lat
            ${{ runner.temp }}/httparena.tsv.thr
            ${{ runner.temp }}/httparena-env.txt
            ${{ runner.temp }}/rthist.txt
            ${{ runner.temp }}/kstatrate.txt
            ${{ runner.temp }}/perf-report-net*.txt
            ${{ runner.temp }}/work/gc-*.txt
            ${{ runner.temp }}/work/*.err
          if-no-files-found: warn
